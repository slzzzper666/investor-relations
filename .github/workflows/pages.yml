name: 部署法說會觀測站

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 20 * * *"   # UTC 20:00 = 台北 04:00，等 Railway pipeline（台北 01:00）跑完後重建資料
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml python-dotenv notion-client yfinance pandas google-genai
      - name: 從 Notion 與 MOPS 重建網站資料
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
          IR_SKIP_FINANCIALS: "1"   # 雲端 MOPS 財報又慢又被擋；財報改用已提交快取，部署由 ~46 分降到 ~5 分
        run: python site/build_data.py
      - name: 建置美股財報資料（yfinance 財報 + Nasdaq 行事曆 + Gemini，分析走已提交快取不重燒額度）
        continue-on-error: true   # 美股是外部網路相依的新步驟；失敗也不可拖垮台股/總經部署
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python site/build_us.py
      - name: 建置總經未來頁資料（yfinance 市場數據 + FRED 經濟數據 + Gemini AI 分析）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python site/build_macro.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v4
