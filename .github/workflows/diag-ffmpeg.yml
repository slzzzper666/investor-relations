name: 診斷 irconference 海外連線（暫時）
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - shell: bash
        run: |
          set +e
          U=https://irconference.twse.com.tw/2329_14_20261002_ch.mp4
          apt-get -qq update >/dev/null && apt-get -qq install -y --no-install-recommends ffmpeg >/dev/null 2>&1
          echo "== Debian ffmpeg"; ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -loglevel error -y -i "$U" -vn -ac 1 -ar 16000 -b:a 32k -t 60 /tmp/b.mp3; echo "debian rc=$?"; ls -la /tmp/b.mp3
          pip install -q imageio-ffmpeg==0.6.0
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          $FF -hide_banner -loglevel error -y -i "$U" -vn -t 5 /tmp/a.mp3; echo "imageio static rc=$?"
          echo "== 舊網址（9/02，當時成功的）"; $FF -hide_banner -loglevel error -y -i https://irconference.twse.com.tw/7714_9_20260902_ch.mp4 -vn -t 5 /tmp/c.mp3; echo "imageio old-url rc=$?"
